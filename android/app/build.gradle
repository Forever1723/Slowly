plugins {
    id 'com.android.application'
}

android {
    namespace 'com.slowly.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.slowly.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        resValue "string", "app_name", "Slowly"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'

    /*
     * 统一 Kotlin 标准库版本 —— 否则 CI 会失败在 :app:checkDebugDuplicateClasses：
     *   Duplicate class kotlin.collections.jdk8.CollectionsJDK8Kt
     *     kotlin-stdlib-1.8.22.jar        （androidx.webkit 带进来的）
     *     kotlin-stdlib-jdk8-1.6.21.jar   （另一条依赖链带进来的）
     *
     * 1.8 起 kotlin-stdlib-jdk7/jdk8 的类已并入 kotlin-stdlib，所以只要还有一条链
     * 带进旧版 jdk7/jdk8，就会和新的 stdlib 撞类。这里三管齐下：
     *   1) resolutionStrategy.force —— 直接钉住版本
     *   2) eachDependency 重写     —— 对付不遵守 force 的传递依赖
     *   3) 显式声明 1.8.22         —— 作为直接依赖参与版本仲裁
     * 这个项目里没有任何 Kotlin 代码，标准库纯粹是 AndroidX 的传递依赖，
     * 统一版本没有副作用。
     */
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
        eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion '1.8.22'
            }
        }
    }
}
