plugins {
    id 'com.android.application'
}

android {
    namespace 'com.slowly.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.slowly.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        resValue "string", "app_name", "Slowly"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}

/*
 * Kotlin 标准库重复类问题。
 *
 * 症状（CI 上失败在 :app:checkDebugDuplicateClasses）：
 *   Duplicate class kotlin.collections.jdk8.CollectionsJDK8Kt
 *     kotlin-stdlib-1.8.22.jar        （androidx.webkit 带进来的）
 *     kotlin-stdlib-jdk8-1.6.21.jar   （另一条链带进来的）
 *
 * 为什么不用 resolutionStrategy：
 *   force 和 eachDependency 都试过，**实测无效** —— 依赖树里 jdk7/jdk8 仍是 1.6.21。
 *   原因是 AGP 的 checkDebugDuplicateClasses 用的是一套 detached configuration，
 *   它不继承 configurations.all/configureEach 上配的解析策略。
 *
 * 所以改用排除法，把这两个旧模块从整张依赖图里去掉：
 *   - 从 Kotlin 1.8 起，kotlin-stdlib-jdk7 / jdk8 的类已经并入 kotlin-stdlib，
 *     这两个模块在新版本里只剩一个空的转发依赖，1.6.21 里却带着实际类；
 *   - 本项目里没有任何 Kotlin 代码，标准库纯粹是 AndroidX 的传递依赖，
 *     真正用到的类都在 kotlin-stdlib（已解析到 1.8.22）里。
 * 也就是说：排掉旧模块既消除冲突，又不丢任何需要的类。
 */
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
